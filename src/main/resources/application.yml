server:
  port: 8081

spring:
  datasource:
    url: "jdbc:mysql://${DATAPILOT_DB_HOST:localhost}:${DATAPILOT_DB_PORT:3306}/${DATAPILOT_DB_NAME:}"
    username: ${DATAPILOT_DB_USERNAME:}
    password: ${DATAPILOT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 按需建立连接，数据库不可用时不影响其他 Agent 能力启动。
      minimum-idle: 0
      maximum-pool-size: 5
      initialization-fail-timeout: -1
      connection-timeout: 5000
      data-source-properties:
        databaseTerm: CATALOG
        connectTimeout: 5000
        socketTimeout: 10000
  sql:
    init:
      mode: never

qwen:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus

harness:
  workspace: "F:/project"

datapilot:
  skills-directory: ${DATAPILOT_SKILLS_DIR:skills}

